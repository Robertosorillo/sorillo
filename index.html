<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SORILLO</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SORILLO">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f0ae16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Diseño: cuaderno de campo en una sola columna. Arriba el panal de estado (un hexágono por asentamiento), abajo barra fija con el botón central de registro. Cifras en tipo estarcido, como el número pintado en las cajas. */
:root {
  --bg: #eceee6;
  --surface: #f8f9f3;
  --surface-2: #e2e5d8;
  --ink: #1c2017;
  --ink-2: #555c4d;
  --line: #ccd1c0;
  --accent: #f0ae16;
  --on-accent: #251b04;
  --accent-text: #7a5200;
  --ok: #2b7440;
  --ok-bg: #d4e8d7;
  --warn: #b85a0b;
  --warn-bg: #f5dfc3;
  --late: #a82a21;
  --late-bg: #f2d0cb;
  --none: #7b8271;
  --none-bg: #dde0d3;
  --font-display: 'Big Shoulders Stencil Display', Impact, 'Arial Narrow', sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14170f; --surface: #1d2117; --surface-2: #272c1f; --ink: #eef0e6; --ink-2: #a5ad98; --line: #343a2a;
    --accent: #f0ae16; --on-accent: #251b04; --accent-text: #f0c35a;
    --ok: #7fcf8f; --ok-bg: #223a28; --warn: #f0a15a; --warn-bg: #4a3317; --late: #f08a80; --late-bg: #4a2420;
    --none: #98a08a; --none-bg: #272c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14170f; --surface: #1d2117; --surface-2: #272c1f; --ink: #eef0e6; --ink-2: #a5ad98; --line: #343a2a;
  --accent: #f0ae16; --on-accent: #251b04; --accent-text: #f0c35a;
  --ok: #7fcf8f; --ok-bg: #223a28; --warn: #f0a15a; --warn-bg: #4a3317; --late: #f08a80; --late-bg: #4a2420;
  --none: #98a08a; --none-bg: #272c1f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 128px;
}
body.lock { overflow: hidden; }
#app { max-width: 640px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.15; font-weight: 700; text-wrap: balance; }
h2 { font-size: 1.25rem; line-height: 1.2; font-weight: 700; text-wrap: balance; }
h3 { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.stack { display: flex; flex-direction: column; gap: 22px; }
.sect { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

/* Marca y aviso de conexión */
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.logo { height: 52px; width: 52px; display: block; border-radius: 12px; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; letter-spacing: .16em; line-height: 1; }
.net { position: sticky; top: 0; z-index: 30; max-width: 640px; margin: 0 auto 12px; padding: 9px 12px; border-radius: var(--r); background: var(--warn-bg); border: 1px solid var(--warn); color: var(--ink); font-size: .85rem; font-weight: 600; }

/* Cabecera y cifra principal */
.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.hero { display: flex; flex-direction: column; gap: 10px; }
.big { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.num { font-family: var(--font-display); font-weight: 800; font-size: clamp(76px, 24vw, 128px); line-height: .82; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.unit { font-size: .85rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding-bottom: 6px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.bar.over > i { background: var(--late); }
.sub { color: var(--ink-2); }
.sub b { color: var(--ink); font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Panal de estado */
.comb { display: flex; flex-wrap: wrap; gap: 6px; }
.hex {
  --hx-bg: var(--none-bg); --hx-line: var(--none);
  position: relative; width: 94px; height: 108px; border: 0; padding: 0; background: var(--hx-line);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.hex::before { content: ""; position: absolute; inset: 3px; background: var(--hx-bg); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.hex > * { position: relative; z-index: 1; }
.hex b { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hex span { font-size: .68rem; font-weight: 600; line-height: 1.15; max-width: 66px; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.k-ok { --hx-bg: var(--ok-bg); --hx-line: var(--ok); }
.k-warn { --hx-bg: var(--warn-bg); --hx-line: var(--warn); }
.k-late { --hx-bg: var(--late-bg); --hx-line: var(--late); }
.k-none { --hx-bg: var(--none-bg); --hx-line: var(--none); }
.wxmap { position: relative; height: 320px; overflow: hidden; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); touch-action: none; user-select: none; -webkit-user-select: none; }
.wxl { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.wxt { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none; }
.wxm { position: absolute; transform: translate(-50%, -50%); min-width: 32px; height: 32px; padding: 0 6px; border-radius: 50%; background: var(--hx-bg); border: 2.5px solid var(--hx-line); color: var(--ink); font: 700 .9rem var(--font-display, inherit); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
.wxm small { position: absolute; top: 33px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 .68rem sans-serif; background: rgba(255,255,255,.88); color: #222; border-radius: 6px; padding: 0 4px; }
.wxm.alm { border-radius: 8px; background: var(--ink); color: var(--surface); border-color: var(--surface); }
.wxctl { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
.wxctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1.1rem; font-weight: 700; cursor: pointer; }
.wxctl button.wide { width: auto; padding: 0 8px; font-size: .75rem; }
.wxatt { position: absolute; left: 6px; bottom: 4px; font-size: .62rem; background: rgba(255,255,255,.8); color: #333; padding: 0 4px; border-radius: 4px; }
.wxr { position: absolute; max-width: none; pointer-events: none; opacity: .65; }
.wxm.vac { opacity: .55; }
.wxctl button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.login { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
.login img { width: 140px; height: 140px; border-radius: 28px; }
.login p { max-width: 340px; color: var(--ink-2); }
.login .btn { min-width: 240px; }
.ialog { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.ialog .chip { text-align: left; }
.iam { padding: 10px 12px; border-radius: 12px; max-width: 94%; font-size: .95rem; overflow-wrap: anywhere; }
.iam.yo { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.iam.ia { align-self: flex-start; background: var(--surface-2); }
.iam p { margin: 0 0 6px; } .iam p:last-child { margin-bottom: 0; }
.iam ul { margin: 2px 0 6px 18px; padding: 0; }
.iat { border-collapse: collapse; font-size: .82rem; margin: 4px 0 8px; }
.iat td, .iat th { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.iaf { display: flex; flex-direction: column; gap: 8px; }
.modo { position: sticky; top: 0; z-index: 15; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 0 auto 16px; background: var(--surface-2); border-radius: 12px; box-shadow: 0 0 0 6px var(--bg); }
.modo button { min-height: 46px; border: 0; border-radius: 9px; background: none; font-weight: 700; font-size: .92rem; color: var(--ink-2); }
.modo button[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.bgp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bgw { display: grid; gap: 2px; text-align: center; font-size: .72rem; }
.bgw > div { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding: 2px 0; }
.bgw > div:first-child { border-left: 0; }
.bgw-i { font-size: 1.15rem; line-height: 1.3; }
.bgn { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bgn .chip { padding: 6px 8px; }
.bgcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.bgc { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 10px; border-radius: 10px; border: 2px solid var(--bgc); background: color-mix(in srgb, var(--bgc) 12%, var(--surface)); }
.bgc-t { font-weight: 700; font-size: .85rem; }
.bgc-v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.bgc-s, .bgc-c { font-size: .72rem; color: var(--ink-2); }
.bgc-c.mal { color: var(--late); font-weight: 700; }
.bgp .pill, #sen-sec .pill { white-space: normal; align-items: flex-start; }
.wxline { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.fold { border-top: 1px solid var(--line); }
.fold-h { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; min-height: 48px; }
.fold-h > span:first-child { display: flex; flex-direction: column; gap: 2px; }
.fold-h .chev { font-size: 1rem; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 11px; height: 12px; background: var(--hx-line); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 700; padding: 3px 9px 3px 7px; border-radius: 99px; background: var(--hx-bg); color: var(--ink); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--hx-line); }

/* Listas */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.row:active { background: var(--surface-2); }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.row-main b { overflow-wrap: anywhere; }
.row-main .muted { font-size: .875rem; overflow-wrap: anywhere; }
.row-main .note { font-size: .85rem; font-style: italic; color: var(--ink-2); overflow-wrap: anywhere; }
.when { font-size: .8rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; align-self: flex-start; }
.badge { flex: none; width: 52px; height: 60px; display: flex; align-items: center; justify-content: center; background: var(--hx-line); position: relative; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.badge::before { content: ""; position: absolute; inset: 2.5px; background: var(--hx-bg); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.badge b { position: relative; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.tag { flex: none; align-self: flex-start; min-width: 92px; text-align: center; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2); }
.tag.t-cosecha { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tag.t-tratamiento { color: var(--warn); border-color: var(--warn); }
.tag.t-baja { color: var(--late); border-color: var(--late); }
.tag.t-enjambre { color: var(--ok); border-color: var(--ok); }
.num.sm { font-size: clamp(60px, 18vw, 96px); }
.meter { display: block; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--late); }
.pct { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; flex: none; }
.facts dd small { font-weight: 600; color: var(--ink-2); }
.chk { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .9rem; }
.chk input { width: 24px; height: 24px; min-height: 0; flex: none; accent-color: var(--accent); }
.month { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding-top: 8px; }
.empty { padding: 20px 16px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--ink-2); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.facts-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.facts-row div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.facts-row .tap { cursor: pointer; }
.facts-row dt { font-size: .75rem; color: var(--ink-2); }
.facts-row dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.facts-row dd small { font-family: var(--font-body); font-weight: 600; font-size: .75rem; color: var(--ink-2); }
dl { margin: 0; }

.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); font-size: .875rem; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .85rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Botones */
.btn { min-height: 48px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { background: var(--late); border-color: var(--late); color: #fff; }
.btn.plain { background: none; border-color: transparent; color: var(--late); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .btn { flex: 1 1 140px; }

/* Barra inferior */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; gap: 4px; }
.tab { min-height: 52px; background: none; border: 0; padding: 0 2px; font-size: clamp(.62rem, 2.9vw, .78rem); line-height: 1.15; font-weight: 600; color: var(--ink-2); }
.tab[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 7px; }
.add { width: 60px; height: 68px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 2rem; font-weight: 700; line-height: 1; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 25; }
.tab.alerta::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 4px; border-radius: 50%; background: var(--late); vertical-align: middle; }
.grid-num { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; }

/* Hoja inferior */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(10, 12, 6, .55); }
.panel { position: relative; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.panel:focus { outline: none; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.x { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.5rem; line-height: 1; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.facts div { min-width: 0; }
.facts dt { font-size: .75rem; color: var(--ink-2); }
.facts dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.facts a { color: var(--accent-text); }

/* Formularios */
form { display: flex; flex-direction: column; gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld label, .legend-t { font-size: .85rem; font-weight: 600; }
.fld small { color: var(--ink-2); font-size: .78rem; }
input, select, textarea { width: 100%; min-height: 48px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; border: 0; padding: 0; margin: 0; }
.seg.s3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.seg label { display: block; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 46px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-weight: 600; font-size: .9rem; }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg input:disabled + span { opacity: .45; }
.err { color: var(--late); font-weight: 600; font-size: .9rem; }
.hint { font-size: .85rem; color: var(--ink-2); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: .9rem; font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }

  const hace = (n) => n <= 0 ? 'hoy' : n === 1 ? 'ayer' : n < 60 ? 'hace ' + n + ' días' : 'hace ' + Math.floor(n / 30) + ' meses';

  function ultimaInsp(cid) {

  /* Bajas de un asentamiento. Con el punto de partida de invernada fijado: bajas desde esa fecha sobre las colmenas con las que entró.

  function bajasRegs(c) {
    const inv = S.cfg.invernada;

  function bajasInfo(c) {

  function balance() {

  function balanceSection() {

  /* ---------- almacenamiento: primero en el móvil, después se envía a la base de datos ---------- */
  const LOCAL = !(window.claude && window.claude.use);
  const FB = !!window.SORILLO_FB;
  function makeStore() {
    let data = { asentamientos: {}, registros: {}, config: {}, almacen: {}, gastos: {}, ingresos: {}, subvenciones: {}, tiempo: {}, productos: {}, patrimonio: {}, formatos: {}, tarros: {}, envasados: {}, pedidos: {}, sensores: {}, lecturas: {} };
    let queue = [];
    let hasCache = false, db = null, flushing = false, retry = null;
    const live = {}, subs = {};
    try {
      const raw = localStorage.getItem(KEY_DATOS);
      if (raw) { data = Object.assign(data, JSON.parse(raw)); hasCache = true; }
      const q = localStorage.getItem(KEY_COLA);
      if (q) queue = JSON.parse(q) || [];
    } catch (e) { /* sin almacenamiento */ }
    const save = () => { try { localStorage.setItem(KEY_DATOS, JSON.stringify(data)); localStorage.setItem(KEY_COLA, JSON.stringify(queue)); } catch (e) { /* sin almacenamiento */ } };
    const applyOp = (m, o) => {
      if (o.op === 'del') delete m[o.id];
      else if (o.op === 'set') m[o.id] = o.d;
      else m[o.id] = Object.assign({}, m[o.id], o.d);
    };
    const view = (c) => {
      const m = Object.assign({}, data[c]);
      queue.forEach((o) => { if (o.c === c) applyOp(m, o); });
      return Object.keys(m).map((id) => Object.assign({ id }, m[id]));
    };
    const emit = (c) => (subs[c] || []).forEach((f) => f(view(c)));
    const COLS = [COL, REG, CFG, ALM, GAS, ING, SUB, TMP, PRD, PAT, FMT, TAR, ENV, PED, SEN, LEC];
    const st = () => ({ pend: queue.length, live: !!db && COLS.every((c) => live[c]), flushing });
    const api = {
      onStatus: null,
      dump: () => JSON.parse(JSON.stringify(data)),
      restore(obj) { COLS.forEach((c) => { if (obj && obj[c] && typeof obj[c] === 'object') data[c] = obj[c]; }); queue = []; hasCache = true; save(); COLS.forEach(emit); status(); },
      status: st,
      attached: () => !!db,
      newId: () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      watch(c, cb) { (subs[c] = subs[c] || []).push(cb); if (hasCache) cb(view(c)); },
      giveUp() { if (!hasCache) { hasCache = true; COLS.forEach(emit); } },
      set: (c, id, d) => push({ op: 'set', c, id, d: JSON.parse(JSON.stringify(d)) }),
      update: (c, id, d) => push({ op: 'update', c, id, d: JSON.parse(JSON.stringify(d)) }),
      del: (c, id) => push({ op: 'del', c, id }),
      attach, flush
    };
    const status = () => { if (api.onStatus) api.onStatus(st()); };
    function push(o) {
      if (LOCAL && !FB) { applyOp(data[o.c], o); save(); emit(o.c); status(); return Promise.resolve(); }
      queue.push(o); save(); emit(o.c); status(); flush(); return Promise.resolve();
    }
    const timeout = (p, ms) => Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('tiempo')), ms))]);
    async function flush() {
      if (!db || flushing || !queue.length) return;
      flushing = true; status();
      try {
        while (queue.length) {
          const o = queue[0];
          const ref = db.collection(o.c).doc(o.id);
          try {
            if (o.op === 'set') await timeout(ref.set(o.d), 15000);
            else if (o.op === 'update') await timeout(ref.update(o.d), 15000);
            else await timeout(ref.delete(), 15000);
          } catch (e) {
            const perdido = o.op === 'update' && e && (e.code === 'not-found' || /not.?found/i.test(String(e.message)));
            if (!perdido) throw e;
          }
          applyOp(data[o.c], o); queue.shift(); save(); status();
        }
      } catch (e) { /* queda pendiente para el próximo intento */ }
      flushing = false; status();
      if (queue.length && !retry) retry = setTimeout(() => { retry = null; flush(); }, 5000);
    }
    function listen(c) {
      try {
        db.collection(c).onSnapshot((snap) => {
          const m = {};
          snap.docs.forEach((x) => { m[x.id] = x.data(); });
          data[c] = m; hasCache = true; live[c] = true; save(); emit(c); status();
          if (COLS.every((k) => live[k])) flush();
        }, () => { live[c] = false; status(); setTimeout(() => listen(c), 15000); });
      } catch (e) { setTimeout(() => listen(c), 15000); }
    }
    function attach(d) {
      if (db) return;
      db = d; COLS.forEach(listen); status();
    }
    return api;
  }
  async function run(fn, okMsg) {

  }

  /* ---------- vistas ---------- */
  /* ---------- cosecha de la temporada por variedad ---------- */

  const PROD_NOM = { miel: 'Miel', polen: 'Polen seco', polenfresco: 'Polen fresco' };
  const anioAct = () => String(new Date().getFullYear());
  function cosechaRows(p, y) {

  function sheetProd(s) {

      rows.map(fila).join('') +

  const TEMP_CAMPOS = [['enjambres', 'Enjambres hechos'], ['inspecciones', 'Inspecciones'], ['tratamientos', 'Tratamientos']];
  function sheetTemp() {
    const y = anioAct(), mt = (S.cfg.manualTemp || {})[y] || {};

  async function guardarTemp(f) {

  /* ---------- el tiempo en cada colmenar ---------- */
  const numEs = (t) => {
    t = String(t).replace(/[.,]+$/, '');
    if (t.indexOf(',') >= 0) return Number(t.replace(/\./g, '').replace(',', '.'));
    if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) return Number(t.replace(/\./g, ''));
    return Number(t);
  };
  function utmALatLon(x, y, huso) {
    const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2), r = Math.PI / 180;
    const M = y / k0, mu = M / (a * (1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 * e2 * e2 / 256));
    const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
    const p1 = mu + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu) + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu) + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu) + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);
    const sn = Math.sin(p1), cs = Math.cos(p1), tn = Math.tan(p1);
    const N1 = a / Math.sqrt(1 - e2 * sn * sn), T1 = tn * tn, C1 = ep2 * cs * cs, R1 = a * (1 - e2) / Math.pow(1 - e2 * sn * sn, 1.5), D = (x - 500000) / (N1 * k0);
    const lat = p1 - (N1 * tn / R1) * (D * D / 2 - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4) / 24 + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
    const lon = (huso * 6 - 183) * r + (D - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6 + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / cs;
    return { lat: lat / r, lon: lon / r };
  }

  /* ---------- sección Asentamientos: número, ubicación y renta ---------- */
  const FREC_M = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 };
  const sinNumero = (c) => c.numero == null || c.numero === '';
  const nombreNum = (c) => (sinNumero(c) ? '' : 'Nº ' + c.numero + ' · ') + c.nombre;
  function addMeses(iso, m) {
    const d = parse(iso), dia = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + m);
    d.setDate(Math.min(dia, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function rentaInfo(c) {
    const r = Number(c.renta) || 0;
    if (r <= 0) return null;
    const f = FRECS[c.rentaFrec] ? c.rentaFrec : 'anual';
    const aviso = c.avisoDias === '' || c.avisoDias == null ? 15 : Math.max(0, Number(c.avisoDias) || 0);
    const miel = c.rentaTipo === 'miel';
    const base = { r, f, anual: r * FRECS[f][0], aviso, miel, txt: miel ? fmtN(r) + ' kg de miel' : eur(r) };
    if (!c.vence) return Object.assign(base, { until: null, k: 'none', t: 'Sin fecha de pago' });
    const until = -dias(c.vence);
    if (until < 0) return Object.assign(base, { until, k: 'late', t: 'Vencida ' + hace(-until) });
    const t = until === 0 ? 'Vence hoy' : until === 1 ? 'Vence mañana' : 'Vence en ' + until + ' días';
    return Object.assign(base, { until, k: until <= aviso ? 'warn' : 'ok', t });
  }
  const alertasRenta = () => S.col.map((c) => ({ c, i: rentaInfo(c) })).filter((x) => x.i && (x.i.k === 'late' || x.i.k === 'warn')).sort((a, b) => a.i.until - b.i.until);
  const ZONAS = [['extremadura', 'Extremadura'], ['salamanca', 'Salamanca']];
  const zonaOf = (c) => ZONAS.some((z) => z[0] === c.zona) ? c.zona : 'sin';
  const zonaNom = (k) => { const z = ZONAS.find((x) => x[0] === k); return z ? z[1] : 'Sin zona'; };
  function viewAsent() {
    const todas = S.col.slice().sort((a, b) => (sinNumero(a) ? 1e9 : Number(a.numero)) - (sinNumero(b) ? 1e9 : Number(b.numero)) || String(a.nombre).localeCompare(String(b.nombre), 'es'));
    const cab = (l) => '<header class="top"><p class="eyebrow">' + l.length + ' ' + plural(l.length, 'asentamiento', 'asentamientos') + ' · ' + l.reduce((a, c) => a + (Number(c.colmenas) || 0), 0) + ' colmenas</p><h1>Asentamientos</h1></header>';
    if (!todas.length) return '<div class="stack">' + cab([]) + '<div class="empty"><p>Aquí se numeran todos tus asentamientos de Extremadura y de Salamanca, con su ubicación, la renta que pagas por cada uno y la fecha de pago. Cuando un pago esté cerca, te lo avisa al abrir la app.</p><button class="btn primary" data-act="new-col">Añadir asentamiento</button></div></div>';

    const lista = todas.filter((c) => zonaOf(c) === z);

    const alHtml = al.length ? '<section class="sect"><h3>Pagos de renta próximos</h3><div class="list">' + al.map((x) => '<div class="row"><span class="row-main"><b>' + esc(nombreNum(x.c)) + '</b><span class="muted">' + esc([zonaOf(x.c) === 'sin' ? '' : zonaNom(zonaOf(x.c)), x.i.txt, fmtCorta(x.c.vence), x.c.propietario].filter(Boolean).join(' · ')) + '</span><span>' + pill(x.i) + '</span></span><button class="btn" data-act="pagar" data-id="' + esc(x.c.id) + '">Anotar pago</button></div>').join('') + '</div></section>' : '';
    const fila = (c) => {
      const i = rentaInfo(c);
      const ubi = [c.lugar, c.altitud != null && c.altitud !== '' ? c.altitud + ' m' : ''].filter(Boolean).join(' · ');
      const btn = '<button class="row" data-act="open-col" data-id="' + esc(c.id) + '"><span class="badge k-none"><b>' + (sinNumero(c) ? '—' : esc(c.numero)) + '</b></span><span class="row-main"><b>' + esc(c.nombre) + '</b><span class="muted">' + esc(ubi || 'Sin ubicación') + '</span>' +
        (i ? '<span class="muted">' + esc('Renta ' + i.txt + ' · ' + FRECS[i.f][1].toLowerCase() + (c.propietario ? ' · ' + c.propietario : '')) + '</span><span>' + pill(i) + '</span>' : '<span class="muted">Sin renta anotada</span>') + '</span></button>';

      (mielA ? '<dl class="facts-row c2"><div><dt>Miel al año · ' + esc(zonaNom(z)) + '</dt><dd>' + fmtN(mielA) + ' kg</dd></div><div><dt>Miel al mes</dt><dd>' + fmtN(mielA / 12) + ' kg</dd></div></dl>' : '') +

  async function numerarFaltan() {

  /* ---------- hojas ---------- */

  function openSheet(s) {

  function drawSheet(focus) {

  function showErr(id, msg) { const el = document.getElementById(id); if (el) { el.textContent = msg; el.hidden = false; el.scrollIntoView({ block: 'nearest' }); } }

  async function guardarReg(form) {
    const id = form.dataset.id;
    const old = id ? S.reg.find((x) => x.id === id) : null;
    const tipo = old ? old.tipo : (form.querySelector('input[name="tipo"]:checked') || {}).value;
    const cid = val('f-col'), fecha = val('f-fecha'), c = findCol(cid);
    if (!c) return showErr('f-err', 'Elige un asentamiento.');
    if (!fecha) return showErr('f-err', 'Indica la fecha.');
    let extra = {};
    if (tipo === 'inspeccion') {
      const v = num('f-varroa');
      if (v != null && (v < 0 || v > 100)) return showErr('f-err', 'La varroa se indica como porcentaje entre 0 y 100.');
      extra = { muestra: num('f-muestra'), huerfanas: num('f-huerfanas') || 0, cria: val('f-cria'), reservas: val('f-reservas'), varroa: v };
    } else if (tipo === 'tratamiento') {
      if (!val('f-producto')) return showErr('f-err', 'Indica el producto aplicado.');
      extra = { producto: val('f-producto'), tratadas: num('f-tratadas'), retirada: val('f-retirada') };
    } else if (tipo === 'traslado') {
      if (old) {
        if (!val('f-destino')) return showErr('f-err', 'Indica el destino.');
        extra = { origen: old.origen, destino: val('f-destino'), altitud: num('f-alt'), floracion: val('f-flor') };
        if (old.destinoId) { extra.destinoId = old.destinoId; extra.n = old.n; }
      } else {
        const dv = val('f-destino'), disp = Number(c.colmenas) || 0;
        if (!dv) return showErr('f-err', 'Elige el destino de la lista o añade uno nuevo.');
        if (dv === c.id) return showErr('f-err', 'El destino no puede ser el mismo asentamiento de salida.');
        const nt = num('f-ntras') == null ? disp : num('f-ntras');
        if (!Number.isInteger(nt) || nt < 1) return showErr('f-err', 'Indica cuántas colmenas se trasladan, con un número entero.');
        if (nt > disp) return showErr('f-err', 'El asentamiento de salida solo tiene ' + disp + ' colmenas.');
        let dest = null, nuevo = null;
        if (dv === '__nuevo') {
          const nn = (val('f-dnombre') || '').trim();
          if (!nn) return showErr('f-err', 'Ponle un nombre al destino nuevo.');
          if (S.col.some((x) => String(x.nombre).trim().toLowerCase() === nn.toLowerCase())) return showErr('f-err', 'Ya existe un asentamiento llamado «' + nn + '»: elígelo en la lista.');
          const cc = (val('f-dcoords') || '').trim();
          if (cc && !parseCoords(cc)) return showErr('f-err', 'No entiendo las coordenadas. Usa grados (42.1234, -4.5678) o UTM X Y.');
          nuevo = { nombre: nn, colmenas: nt, altitud: num('f-alt'), lugar: '', aprov: c.aprov || 'miel', floracion: val('f-flor'), llegada: fecha, coords: cc, notas: '', zona: '', numero: null, renta: null, ts: Date.now() };
        } else { dest = findCol(dv); if (!dest) return showErr('f-err', 'No encuentro ese destino. Elígelo otra vez.'); }
        extra = { origen: c.nombre, destino: nuevo ? nuevo.nombre : dest.nombre, destinoId: nuevo ? S.store.newId() : dest.id, n: nt, altitud: num('f-alt'), floracion: val('f-flor') };
        extra._nuevo = nuevo; extra._dest = dest;
      }
    } else if (tipo === 'cosecha') {
      const kg = num('f-kg');
      if (kg == null || kg <= 0) return showErr('f-err', 'Indica los kilos cosechados.');
      extra = { kg, prod: val('f-prod') || 'miel', producto: val('f-producto'), lote: val('f-lote') };
    } else if (tipo === 'baja' || tipo === 'enjambre') {
      const n = num('f-n');
      if (n == null || n < 1 || Math.floor(n) !== n) return showErr('f-err', 'Indica cuántas, con un número entero.');
      const chk = document.getElementById('f-ajuste');
      const aj = !old && !!(chk && chk.checked);
      if (tipo === 'baja' && aj && n > (Number(c.colmenas) || 0)) return showErr('f-err', 'El asentamiento solo tiene ' + (Number(c.colmenas) || 0) + ' colmenas.');
      const ajustado = aj || (old ? !!old.ajustado : false);
      extra = tipo === 'baja' ? { n, causa: val('f-causa'), ajustado } : { n, metodo: val('f-metodo'), ajustado };
    }
    const nuevoDest = extra._nuevo, destAct = extra._dest; delete extra._nuevo; delete extra._dest;
    const doc = Object.assign({ tipo, asentamientoId: cid, asentamientoNombre: c.nombre, fecha, notas: val('f-notas'), ts: old ? (old.ts || Date.now()) : Date.now() }, extra);
    if (old) { if (old.guia) doc.guia = old.guia; if (old.guiaNum) doc.guiaNum = old.guiaNum; }
    const rid = id || S.store.newId();
    const ok = await run(async () => {

  /* ---------- SENSORES (BeeGuard): básculas, temperatura y humedad importadas desde CSV ---------- */
  const TIPOS_SEN = [['peso', 'Báscula (peso)', 'kg'], ['temp', 'Temperatura', '°C'], ['hum', 'Humedad', '%'], ['otro', 'Otro dato', '']];

  function serie(sid) {

  /* resumen diario: peso = media de 0 a 5 h (colmena en reposo); temperatura = mínima y máxima; humedad = media */

    return Object.keys(d).sort().map((f) => { const o = d[f]; return { f, v: sen.tipo === 'peso' ? (o.noche.length ? avg(o.noche) : avg(o.all)) : avg(o.all), min: Math.min.apply(null, o.all), max: Math.max.apply(null, o.all) }; });

  function grafica(sen, dias) {

      const nt = document.getElementById('f-ntras'); if (nt) nt.value = c && c.colmenas != null ? c.colmenas : '';
    } else if (t.id === 'm-file') {
      const f = t.files && t.files[0], id = t.dataset.id; t.value = '';
      if (!f) return;
      if (f.size > 15 * 1024 * 1024) { toast('El archivo es demasiado grande (máximo 15 MB)'); return; }
      toast('Guardando el documento…');
      guardarArchivo(f).then((g) => run(() => S.store.update(REG, id, { guia: g }), 'Documento adjuntado')).then(() => { if (S.sheet && S.sheet.type === 'mov') drawSheet(false); })
        .catch(() => toast('No se pudo guardar el documento en este momento'));
    } else if (t.id === 'f-destino' && document.getElementById('f-nuevo-wrap')) {
      document.getElementById('f-nuevo-wrap').hidden = t.value !== '__nuevo';
    } else if (t.id === 'f-sen') { importarSensores(t.files && t.files[0]); t.value = '';
    } else if (t.id === 'l-fmt') {
      const f = findFmt(t.value), sb = document.getElementById('l-bid');
      if (sb) sb.innerHTML = opcBid(f);
      loteResumen();
    } else if (t.id === 'l-bid') {
      const b = S.prd.find((y) => y.id === t.value), vi = document.getElementById('l-var'), li = document.getElementById('l-lote'); if (b && vi && !vi.value) vi.value = catDe(varPrd(b)) ? catDe(varPrd(b))[0] : varPrd(b);
      if (li && !li.dataset.tocado) li.value = b ? loteDe(b) : li.dataset.def;
      loteResumen();
    } else if (t.classList && t.classList.contains('pl-fmt')) {
      const f = findFmt(t.value), r = t.closest('.pl'), pr = r && r.querySelector('.pl-pr'); if (f && pr && f.pvp != null) pr.value = f.pvp; pedTotalVivo();
    } else if (t.id === 'p-est') { const f0 = t.closest('form'); if (f0) delete f0.dataset.forzar;
    } else if (t.id === 'a-cat') {
      const c = CAT_ALM.concat(CAT_ENV).find((x) => x[0] === t.value), u = document.getElementById('a-uni');
      if (c && u) u.value = c[2];
    } else if (t.name === 'gtipo') {
      const f = t.value === 'fijo', w = document.getElementById('g-frec-wrap');
      if (w) w.hidden = !f;
      const wl = document.getElementById('g-lit-wrap'); if (wl) wl.hidden = f;
      const l1 = document.querySelector('label[for="g-fecha"]'), l2 = document.querySelector('label[for="g-importe"]');
      if (l1) l1.textContent = f ? 'Desde' : 'Fecha';
      if (l2) l2.textContent = f ? 'Importe de cada pago (€)' : 'Importe (€)';
    } else if (t.id === 'g-concepto') {
      const c = CONCEPTOS.find((x) => x[0].toLowerCase() === t.value.trim().toLowerCase()), sel = document.getElementById('g-cat');
      if (c && sel) sel.value = CAT_GAS[c[1]];
    } else if (t.classList && t.classList.contains('qty-in')) {
      guardaQty(t);
    }
  });
  /* Cantidad escrita a mano en la lista del almacén */
  function guardaQty(t) {
    const x = S.alm.find((y) => y.id === t.dataset.id); if (!x) return;
    const raw = t.value.trim().replace(',', '.');
    if (raw === '') { t.value = sinContar(x) ? '' : x.cantidad; return; }
    const n = Math.round(Number(raw) * 100) / 100;
    if (!isFinite(n) || n < 0) { t.value = sinContar(x) ? '' : x.cantidad; toast('Escribe un número igual o mayor que 0.'); return; }
    if (!sinContar(x) && n === Number(x.cantidad)) return;
    run(() => S.store.update(ALM, x.id, { cantidad: n }));
  }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.id === 'ia-in') S.ia.draft = t.value;
    if (t && (t.id === 'l-n' || t.id === 'l-var')) loteResumen();
    if (t && t.id === 'l-lote') t.dataset.tocado = '1';
    if (t && t.closest && t.closest('#p-lineas')) { const f0 = t.closest('form'); if (f0) delete f0.dataset.forzar; pedTotalVivo(); }
    if (t && (t.id === 'i-cant' || t.id === 'i-precio')) { const o = document.getElementById('i-total'); if (o) o.textContent = eurP((Number(val('i-cant')) || 0) * (Number(val('i-precio')) || 0)); }
  });
  document.addEventListener('focusin', (e) => { const t = e.target; if (t.classList && t.classList.contains('qty-in')) { try { t.select(); } catch (er) { /* opcional */ } } });
  document.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t.classList && t.classList.contains('qty-in')) setTimeout(() => { const a = document.activeElement; if (S.dirty && !(a && a.classList && a.classList.contains('qty-in'))) { S.dirty = false; render(); } }, 0);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('qty-in')) e.target.blur(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

  /* ---------- arranque ---------- */
  const netEl = $('#net');
  function updateNet(st) {
    st = st || (S.store ? S.store.status() : { pend: 0, live: false });
    const off = navigator.onLine === false;
    let msg = '';
    if (st.pend > 0) msg = (st.live && !off) ? 'Enviando ' + st.pend + ' ' + plural(st.pend, 'cambio', 'cambios') + '…' : st.pend + ' ' + plural(st.pend, 'cambio guardado', 'cambios guardados') + ' en el móvil. Se enviarán solos cuando haya conexión.';
    else if (off) msg = 'Sin conexión. Puedes seguir anotando: se guarda en el móvil.';
    netEl.textContent = msg; netEl.hidden = !msg;
  }
  /* ---------- acceso con Google (Firebase) ---------- */
  const loginEl = $('#login');
  const msgAuth = (e) => {
    const c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
    if (c === 'auth/unauthorized-domain') return 'Falta autorizar esta dirección en Firebase (Authentication → Configuración → Dominios autorizados).';
    if (c === 'auth/network-request-failed') return 'Sin conexión. Inténtalo cuando tengas cobertura.';
    return 'No se pudo entrar (' + c + ').';
  };
  function pintarLogin(msg) {
    loginEl.innerHTML = '<img src="icon-512.png" alt="SORILLO"><h1>SORILLO</h1><p>Cuaderno de campo de la explotación. Entra con tu cuenta de Google para ver y anotar los datos.</p>' +
      '<button class="btn primary" data-act="login">Entrar con Google</button>' + (msg ? '<p class="err">' + esc(msg) + '</p>' : '');
    loginEl.hidden = false;
  }
  function pintarNoAcceso(u) {
    loginEl.innerHTML = '<img src="icon-512.png" alt="SORILLO"><h1>Sin permiso</h1><p>La cuenta <b>' + esc(u.email || '') + '</b> no tiene permiso para usar SORILLO. Pide al responsable que la añada.</p>' +
      '<button class="btn" data-act="logout">Entrar con otra cuenta</button>';
    loginEl.hidden = false;
  }
  function entrar() {
    const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider();
    prov.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(prov).catch((e) => {
      const c = (e && e.code) || '';
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') return auth.signInWithRedirect(prov);
      pintarLogin(msgAuth(e));
    });
  }
  function salir() {
    try { const q = JSON.parse(localStorage.getItem(KEY_COLA) || '[]'); if (!q.length) localStorage.removeItem(KEY_DATOS); } catch (e) { /* nada */ }
    firebase.auth().signOut().then(() => location.reload());
  }
  function fbInit() {
    if (!FB || !window.firebase) { boot(); return; }
    firebase.initializeApp(window.SORILLO_FB);
    S.fbDb = firebase.firestore();
    const auth = firebase.auth();
    auth.getRedirectResult().catch((e) => pintarLogin(msgAuth(e)));
    auth.onAuthStateChanged(async (u) => {
      S.user = u;
      if (!u) { pintarLogin(); return; }
      try { await S.fbDb.collection(CFG).doc('main').get(); }
      catch (e) { if (e && e.code === 'permission-denied') { pintarNoAcceso(u); return; } }
      loginEl.hidden = true; loginEl.innerHTML = '';
      if (!S.booted) { S.booted = true; boot(); } else if (S.store) S.store.attach(S.fbDb);
    });
  }
  async function importarCopia(d) {
    const cols = [COL, REG, CFG, ALM, GAS, ING, SUB, PRD, PAT, FMT, TAR, ENV, PED, SEN, LEC];
    let n = 0;
    for (const c of cols) { const m = d[c]; if (!m || typeof m !== 'object') continue; for (const id of Object.keys(m)) { await S.store.set(c, id, m[id]); n++; } }
    return n;
  }

  async function boot() {
    S.store = makeStore();
    S.store.onStatus = updateNet;
    S.store.watch(CFG, (d) => { const m = d.find((x) => x.id === 'main'); S.cfg = Object.assign({ total: 567 }, m || {}); if (S.loaded.col && S.loaded.reg) refresh(); });
    S.store.watch(COL, (d) => { S.col = d; S.loaded.col = true; refresh(); if (LOCAL) setTimeout(() => wxLiveTodos(false), 0); });
    S.store.watch(REG, (d) => { S.reg = d; S.loaded.reg = true; refresh(); });
    S.store.watch(ALM, (d) => { S.alm = d; S.loaded.alm = true; refresh(); });
    S.store.watch(GAS, (d) => { S.gas = d; S.loaded.gas = true; refresh(); });
    S.store.watch(ING, (d) => { S.ing = d; S.loaded.ing = true; refresh(); });
    S.store.watch(SUB, (d) => { S.sub = d; S.loaded.sub = true; refresh(); });
    S.store.watch(TMP, (d) => { S.tmp = d; S.loaded.tmp = true; refresh(); });
    S.store.watch(PRD, (d) => { S.prd = d; S.loaded.prd = true; refresh(); });
    S.store.watch(PAT, (d) => { S.pat = d; S.loaded.pat = true; refresh(); });
    S.store.watch(FMT, (d) => { S.fmt = d; S.loaded.fmt = true; refresh(); });
    S.store.watch(TAR, (d) => { S.tar = d; S.loaded.tar = true; refresh(); });
    S.store.watch(ENV, (d) => { S.env = d; S.loaded.env = true; refresh(); });
    S.store.watch(PED, (d) => { S.ped = d; S.loaded.ped = true; refresh(); });
    S.store.watch(SEN, (d) => { S.sen = d; S.loaded.sen = true; refresh(); });
    S.store.watch(LEC, (d) => { S.lec = d; S.loaded.lec = true; refresh(); });
    render(); updateNet();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* opcional */ }
    async function conectar() {
      if (S.store.attached()) { S.store.flush(); return; }
      if (FB) { if (S.fbDb && S.user) S.store.attach(S.fbDb); return; }
      try {
        const db = window.claude && window.claude.use ? await Promise.race([window.claude.use('db'), new Promise((_, rj) => setTimeout(() => rj(new Error('tiempo')), 8000))]) : null;
        if (db) S.store.attach(db);
      } catch (e) { /* sin conexión: se reintenta */ }
    }
    conectar();
    if (LOCAL) { S.store.giveUp(); wxLiveTodos(false); setInterval(() => wxLiveTodos(false), 10 * 60e3); }
    else setTimeout(() => S.store.giveUp(), 6000);
    setInterval(conectar, 20000);
    window.addEventListener('online', () => { updateNet(); conectar(); });
    window.addEventListener('offline', () => updateNet());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { conectar(); if (LOCAL) wxLiveTodos(false); } });
  }
  fbInit();
})();
</script>

<script type="module">
/* Asistente IA: Gemini a través de Firebase AI Logic, protegido con App Check (reCAPTCHA v3) */
const B = 'https://www.gstatic.com/firebasejs/13.4.0/';
const KEY = window.SORILLO_RECAPTCHA;
const MODELOS = ['gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-flash-latest'];
let listo = null;
async function arrancar() {
  const [a, c, ia] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-app-check.js'), import(B + 'firebase-ai.js')]);
  const app = a.initializeApp(window.SORILLO_FB, 'ia');
  c.initializeAppCheck(app, { provider: new c.ReCaptchaEnterpriseProvider(KEY), isTokenAutoRefreshEnabled: true });
  return { ai: ia.getAI(app, { backend: new ia.GoogleAIBackend() }), getGenerativeModel: ia.getGenerativeModel };
}
window.SORILLO_IA = {
  listo: !!KEY,
  async chat(contents, sistema) {
    listo = listo || arrancar();
    const { ai, getGenerativeModel } = await listo;
    let ultimo;
    for (const m of MODELOS) {
      try {
        const model = getGenerativeModel(ai, { model: m, systemInstruction: sistema, generationConfig: { temperature: 0.4 } });
        const r = await model.generateContent({ contents });
        return r.response.text();
      } catch (e) {
        ultimo = e;
        if (!/404|not.?found|not supported|unsupported/i.test(String((e && e.message) || ''))) throw e;
      }
    }
    throw ultimo;
  }
};
</script>
